# ==============================================================================
# BraTS Segmentation — Docker Compose
#
# Install docker-compose:
#   sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
#       -o /usr/local/bin/docker-compose && sudo chmod +x /usr/local/bin/docker-compose
#
# Usage:
#   docker-compose run --rm exp01          # Run single experiment
#   docker-compose run --rm eval           # Evaluate latest run
#   docker-compose up tensorboard          # View training curves at localhost:6006
#   docker-compose run --rm compare        # Compare all runs
#   docker-compose run --rm native         # Native nnU-Net v2 pipeline
#   docker-compose run --rm shell          # Interactive shell
# ==============================================================================

x-gpu-common: &gpu-common
  image: brats-seg
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  volumes:
    - ../Brats2024:/data/Brats2024:ro
    - ../Brats2023:/data/Brats2023:ro
    # exp27 only: data.synthetic_train_dirs is read from the YAML and has NO CLI override
    # (src/nnunet_replica/splits.py:70), so the literal string ../Brats2024/synthetic_regaug
    # has to resolve from WORKDIR=/app — i.e. /Brats2024 must exist in the container.
    # Without this mount exp27 dies with FileNotFoundError before the first epoch.
    - ../Brats2024:/Brats2024:ro
    - ./runs:/app/runs
    - ./.cache:/app/.cache
    # replica.preprocessed_dir is hardcoded to /app/.cache/replica/... in every config.
    # Point REPLICA_CACHE at wherever the caches actually live if that is not ./.cache/replica
    # (e.g. when the host .cache is root-owned from an earlier container run):
    #   REPLICA_CACHE=/home/<user>/brats_replica_cache docker-compose run --rm replica-train
    - ${REPLICA_CACHE:-./.cache/replica}:/app/.cache/replica
    - ./nnunet_data:/app/nnunet_data
    # Live-mount source so code edits don't need a rebuild
    - ./src:/app/src
    - ./experiments:/app/experiments
    - ./configs:/app/configs
    - ./nnunet_native:/app/nnunet_native
    - ./plans:/app/plans
    - ./train.py:/app/train.py
    - ./preprocess_replica.py:/app/preprocess_replica.py
    - ./train_replica.py:/app/train_replica.py
    - ./evaluate_replica.py:/app/evaluate_replica.py
    - ./train_kfold.py:/app/train_kfold.py
    - ./evaluate.py:/app/evaluate.py
    - ./evaluate_kfold.py:/app/evaluate_kfold.py
    - ./analyze_failures.py:/app/analyze_failures.py
    - ./visualize_segmentations.py:/app/visualize_segmentations.py
    - ./export_3d_html.py:/app/export_3d_html.py
    - ./visualizations:/app/visualizations
    - ./visualizations_3d:/app/visualizations_3d
    - ./eval_exp18_fold0:/app/eval_exp18_fold0
  working_dir: /app
  shm_size: "8g"

services:
  # ====================================================================
  # Phase 1 — Baseline model comparison (BraTS 2024)
  # ====================================================================
  exp01:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp01_segresnet_baseline.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp02:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp02_dynunet_baseline.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp03:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp03_nnunet_v2_baseline.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp04:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp04_swin_unetr_baseline.yaml
        --data_dir /data/Brats2024/training_data1_v2

  # ====================================================================
  # Phase 2 — Loss function study
  # ====================================================================
  exp05:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp05_dice_ce.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp06:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp06_dice_focal.yaml
        --data_dir /data/Brats2024/training_data1_v2

  # ====================================================================
  # Phase 3 — Input resolution study
  # ====================================================================
  exp07:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp07_crop96.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp08:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp08_crop160.yaml
        --data_dir /data/Brats2024/training_data1_v2

  # ====================================================================
  # Phase 3b — Large patch experiments (DynUNet & nnU-Net v2 use ~4 GB at 128^3)
  # ====================================================================
  exp14:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp14_dynunet_large_patch.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp15:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp15_nnunet_v2_large_patch.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp16:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp16_nnunet_v2_max_patch.yaml
        --data_dir /data/Brats2024/training_data1_v2

  # ====================================================================
  # 5-Fold CV — nnU-Net v2 with 128×160×128 patch, all data
  # ====================================================================
  exp17:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp17_nnunet_v2_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2

  # Run a single fold (pass --fold 0..4)
  exp17-fold0:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp17_nnunet_v2_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 0

  exp17-fold1:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp17_nnunet_v2_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 1

  exp17-fold2:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp17_nnunet_v2_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 2

  exp17-fold3:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp17_nnunet_v2_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 3

  exp17-fold4:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp17_nnunet_v2_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 4

  # ====================================================================
  # 5-Fold CV — nnU-Net v2 ResidualEncoderUNet (47.1M)
  # ====================================================================
  exp18:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp18-fold0:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 0

  exp18-fold0-resume:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 0
        --resume_dir runs/nnunet_v2_20260507_021354_fold0

  exp18-fold1:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 1

  exp18-fold2:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 2

  exp18-fold3:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 3

  exp18-fold4:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --fold 4

  # exp20 (SUPERSEDED) — custom loop, TRUE ResEnc-M architecture (~102M), SGD recipe,
  # 5-fold CV. Kept to reproduce the runs already in runs/. New work should use the
  # replica services below (replica-exp20-fold0 ...); see NNUNET_REPLICA.md.
  exp20:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/superseded/exp20_nnunet_v2_resenc_m_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional

  exp20-fold0:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/superseded/exp20_nnunet_v2_resenc_m_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 0

  exp20-fold1:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/superseded/exp20_nnunet_v2_resenc_m_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 1

  exp20-fold2:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/superseded/exp20_nnunet_v2_resenc_m_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 2

  exp20-fold3:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/superseded/exp20_nnunet_v2_resenc_m_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 3

  exp20-fold4:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/superseded/exp20_nnunet_v2_resenc_m_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 4

  # Resume the interrupted fold-2 run (continues in-place from its best_model.pth).
  exp20-fold2-resume:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/superseded/exp20_nnunet_v2_resenc_m_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 2
        --resume_dir runs/nnunet_v2_20260630_160330_fold2

  # Resume the interrupted fold-3 run (continues in-place from its best_model.pth,
  # epoch 100 -> 250).
  exp20-fold3-resume:
    <<: *gpu-common
    command: >
      python train_kfold.py
        --config experiments/superseded/exp20_nnunet_v2_resenc_m_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 3
        --resume_dir runs/nnunet_v2_20260703_175837_fold3

  # ====================================================================
  # Phase 4 — nnU-Net v2 architecture variants
  # ====================================================================
  exp09:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp09_nnunet_v2_plain.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp10:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp10_nnunet_v2_residual.yaml
        --data_dir /data/Brats2024/training_data1_v2

  # ====================================================================
  # Phase 5 — Native nnU-Net v2 pipeline
  # ====================================================================
  native:
    <<: *gpu-common
    command: >
      bash nnunet_native/run_nnunet.sh
        --data_dir /data/Brats2024/training_data1_v2
        --gpu 0
    environment:
      - nnUNet_raw=/app/nnunet_data/nnUNet_raw
      - nnUNet_preprocessed=/app/nnunet_data/nnUNet_preprocessed
      - nnUNet_results=/app/nnunet_data/nnUNet_results

  # ====================================================================
  # Phase 6 — BraTS 2023 best model
  # ====================================================================
  exp11:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp11_brats2023_best.yaml
        --data_dir /data/Brats2023/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData

  # ====================================================================
  # Phase 7 — Cross-dataset generalization
  # ====================================================================
  exp12:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp12_train2024_test2023.yaml
        --data_dir /data/Brats2024/training_data1_v2

  exp13:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/exp13_train2023_test2024.yaml
        --data_dir /data/Brats2023/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData

  # ====================================================================
  # Overfit sanity check — memorize 50 MRIs (train = val = test, aug OFF)
  # ====================================================================
  # Pick the experiment via the OFIT_CONFIG host env var (interpolated by compose
  # at parse time, so it must be exported on the host — not passed with -e).
  # Defaults to BraTS-2024 data; override OFIT_DATA for the 2023 experiments.
  #
  # Usage:
  #   OFIT_CONFIG=overfit_exp19_nnunet_native_resenc_5fold.yaml docker-compose run --rm overfit
  #   OFIT_CONFIG=overfit_exp01_segresnet_baseline.yaml         docker-compose run --rm overfit
  #   OFIT_CONFIG=overfit_exp13_train2023_test2024.yaml \
  #     OFIT_DATA=/data/Brats2023/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData \
  #     docker-compose run --rm overfit
  overfit:
    <<: *gpu-common
    command: >
      python train.py
        --config experiments/overfit/${OFIT_CONFIG}
        --data_dir ${OFIT_DATA:-/data/Brats2024/training_data1_v2}

  # ====================================================================
  # Utilities
  # ====================================================================

  # Evaluate the most recent run
  eval:
    <<: *gpu-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        RUN_DIR=$$(ls -td runs/*/ 2>/dev/null | head -1)
        if [ -z "$$RUN_DIR" ]; then echo "No runs found"; exit 1; fi
        echo "Evaluating: $$RUN_DIR"
        python evaluate.py --run_dir "$$RUN_DIR" --visualize_failures

  # Evaluate a specific run (pass RUN_NAME env var)
  eval-run:
    <<: *gpu-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ -z "$${RUN_NAME}" ]; then echo "Set RUN_NAME: docker-compose run --rm -e RUN_NAME=segresnet_20260329_120000 eval-run"; exit 1; fi
        python evaluate.py --run_dir "runs/$${RUN_NAME}" --visualize_failures

  # Compare all completed runs
  compare:
    <<: *gpu-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        python analyze_failures.py --run_dirs runs/*/ --compare

  # TensorBoard — view at http://localhost:6006
  tensorboard:
    <<: *gpu-common
    command: ["tensorboard", "--logdir", "runs", "--host", "0.0.0.0", "--port", "6006"]
    ports:
      - "6006:6006"

  # Interactive shell
  shell:
    <<: *gpu-common
    entrypoint: ["bash"]
    stdin_open: true
    tty: true

  # ====================================================================
  # Exp 18 — K-Fold Evaluation (with vs without post-processing)
  # ====================================================================
  # Usage:
  #   docker-compose run --rm eval-kfold-val
  #   docker-compose run --rm eval-kfold-test
  eval-kfold-val:
    <<: *gpu-common
    command: >
      python evaluate_kfold.py
        --fold_dirs runs/nnunet_v2_20260507_021354_fold0
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --split val_fold0
        --data_dir /data/Brats2024/training_data1_v2
        --output_dir eval_exp18_fold0
        --num_workers 4

  eval-kfold-test:
    <<: *gpu-common
    command: >
      python evaluate_kfold.py
        --fold_dirs runs/nnunet_v2_20260507_021354_fold0
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --split all
        --data_dir /data/Brats2024/training_data1_v2
        --output_dir eval_exp18_fold0
        --num_workers 4

  # ====================================================================
  # Exp 18 — Per-Case Segmentation Visualisations (3-D + multi-planar)
  # ====================================================================
  # Each command writes one PNG per case into ./visualizations/<split>/
  #
  # Usage:
  #   docker-compose run --rm visualize-val    # 272 val cases (fold 0)
  #   docker-compose run --rm visualize-test   # ~129 held-out test cases
  #   docker-compose run --rm visualize-all    # both splits
  #   docker-compose run --rm visualize-smoke  # 3 cases each, for a quick check

  visualize-val:
    <<: *gpu-common
    command: >
      python visualize_segmentations.py
        --fold_dirs runs/nnunet_v2_20260507_021354_fold0
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --splits val_fold0
        --data_dir /data/Brats2024/training_data1_v2
        --output_dir visualizations
        --num_workers 4

  visualize-test:
    <<: *gpu-common
    command: >
      python visualize_segmentations.py
        --fold_dirs runs/nnunet_v2_20260507_021354_fold0
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --splits test
        --data_dir /data/Brats2024/training_data1_v2
        --output_dir visualizations
        --num_workers 4

  visualize-all:
    <<: *gpu-common
    command: >
      python visualize_segmentations.py
        --fold_dirs runs/nnunet_v2_20260507_021354_fold0
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --splits val_fold0 test
        --data_dir /data/Brats2024/training_data1_v2
        --output_dir visualizations
        --num_workers 4

  # Quick sanity check — 3 cases per split, no 3-D rendering
  visualize-smoke:
    <<: *gpu-common
    command: >
      python visualize_segmentations.py
        --fold_dirs runs/nnunet_v2_20260507_021354_fold0
        --config experiments/exp18_nnunet_v2_residual_5fold.yaml
        --splits val_fold0 test
        --data_dir /data/Brats2024/training_data1_v2
        --output_dir visualizations/smoke
        --max_cases 3
        --no_3d
        --num_workers 2

  # ====================================================================
  # Exp 18 — Interactive 3-D GT vs Prediction export (side-by-side HTML)
  # ====================================================================
  # Writes one self-contained, camera-synced HTML per case into
  # ./visualizations_3d/{test_set,train_sample}/.  Open in any browser.
  # plotly is pip-installed at start so no image rebuild is needed.
  #
  # Usage:
  #   docker-compose run --rm export-3d         # test_set (val_fold0) + 50 train cases
  #   docker-compose run --rm export-3d-smoke   # 2 cases per split, quick check

  export-3d:
    <<: *gpu-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install -q plotly
        python export_3d_html.py \
          --fold_dirs runs/nnunet_v2_20260507_021354_fold0 \
          --config experiments/exp18_nnunet_v2_residual_5fold.yaml \
          --test_source val_fold0 \
          --n_train 50 \
          --output_dir visualizations_3d \
          --data_dir /data/Brats2024/training_data1_v2 \
          --num_workers 4

  export-3d-smoke:
    <<: *gpu-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install -q plotly
        python export_3d_html.py \
          --fold_dirs runs/nnunet_v2_20260507_021354_fold0 \
          --config experiments/exp18_nnunet_v2_residual_5fold.yaml \
          --test_source val_fold0 \
          --n_train 2 \
          --output_dir visualizations_3d/smoke \
          --data_dir /data/Brats2024/training_data1_v2 \
          --max_cases 2 \
          --num_workers 2

  # ====================================================================
  # nnU-Net REPLICA (exp20+) — custom loop that reproduces the native run
  # ====================================================================
  # The replica reads plans/nnUNetResEncM_11GBPlans.json and reimplements nnU-Net v2's
  # preprocessing, sampling, augmentation, loss, schedule, loop and inference in
  # src/nnunet_replica/. Two steps: build the case cache once, then train per fold.
  #
  #   docker-compose run --rm replica-preprocess            # ~10 min, ~30 GB
  #   docker-compose run --rm replica-exp20-fold0           # ~3.5 days
  #   docker-compose run --rm replica-exp20-fold0-resume    # after any interruption
  #   docker-compose run --rm replica-eval-val              # OOF CV Dice/HD95
  #
  # Pick a different experiment with the REPLICA_CONFIG host env var (compose
  # interpolates it at parse time, so export it — do not pass it with -e):
  #   REPLICA_CONFIG=exp24_replica_plain_unet_11g_5fold.yaml \
  #     docker-compose run --rm replica-train
  #
  # Env vars honoured by the replica services:
  #   REPLICA_CONFIG  experiment YAML basename   (default exp20_replica_resenc_m_11g_5fold.yaml)
  #   REPLICA_FOLD    fold index 0-4             (default 0)
  #   REPLICA_ARGS    extra train_replica.py flags, e.g. "--num_workers 8 --epochs 250"
  #   RUN_DIRS        run dirs for the eval services
  # Build the preprocessed case cache (idempotent — re-running resumes).
  replica-preprocess:
    <<: *gpu-common
    command: >
      python preprocess_replica.py
        --config experiments/${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml}
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --num_processes 8

  # Preprocess only what one fold needs, so training can start sooner.
  replica-preprocess-fold0:
    <<: *gpu-common
    command: >
      python preprocess_replica.py
        --config experiments/${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml}
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --num_processes 8
        --fold 0

  # Generic trainer: choose the experiment with REPLICA_CONFIG and the fold with REPLICA_FOLD.
  replica-train:
    <<: *gpu-common
    command: >
      python train_replica.py
        --config experiments/${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml}
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold ${REPLICA_FOLD:-0}
        ${REPLICA_ARGS:-}

  # Resume whichever fold REPLICA_FOLD names, in place, from checkpoint_latest.pth.
  replica-train-resume:
    <<: *gpu-common
    command: >
      python train_replica.py
        --config experiments/${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml}
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold ${REPLICA_FOLD:-0}
        ${REPLICA_ARGS:-}
        --c

  # --------------------------------------------------------------------
  # 11 GB variants — the plan's FULL memory footprint, no recomputation
  # --------------------------------------------------------------------
  # Identical training to the services above; the only difference is that encoder
  # activations are stored instead of recomputed (~2x faster steps, needs the ~11 GB
  # the plan was budgeted for). REQUIRES A >= 11 GB GPU: on the 8 GB RTX 3070 Laptop
  # this OOMs at the plan's batch 2 (measured), so use the plain services there.
  #
  #   REPLICA_FOLD=0 docker-compose run --rm replica-train-11g
  #   REPLICA_FOLD=0 docker-compose run --rm replica-train-11g-resume
  #   REPLICA_CONFIG=exp24_replica_plain_unet_11g_5fold.yaml \
  #     REPLICA_FOLD=0 docker-compose run --rm replica-train-11g
  replica-train-11g:
    <<: *gpu-common
    command: >
      python train_replica.py
        --config experiments/${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml}
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold ${REPLICA_FOLD:-0}
        --no_grad_checkpointing
        ${REPLICA_ARGS:-}

  replica-train-11g-resume:
    <<: *gpu-common
    command: >
      python train_replica.py
        --config experiments/${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml}
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold ${REPLICA_FOLD:-0}
        --no_grad_checkpointing
        ${REPLICA_ARGS:-}
        --c

  # Does the plan's batch 2 actually fit this GPU without recomputation? Answers in
  # ~2 minutes instead of finding out 40 minutes into a real run.
  replica-fit-check-11g:
    <<: *gpu-common
    command: >
      python train_replica.py
        --config experiments/${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml}
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 0
        --no_grad_checkpointing
        --smoke_test
        --max_cases 4
        --num_workers 4
        --no_final_validation

  # Wiring check: 2 epochs x 5 iterations on 4 cases. Proves the stack runs; proves
  # nothing about accuracy.
  replica-smoke:
    <<: *gpu-common
    command: >
      python train_replica.py
        --config experiments/${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml}
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional
        --fold 0
        --smoke_test
        --max_cases 4
        --num_workers 4

  # Named per-fold shortcuts for the exp20 baseline.
  replica-exp20-fold0:
    <<: *gpu-common
    command: >
      python train_replica.py --config experiments/exp20_replica_resenc_m_11g_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional --fold 0

  replica-exp20-fold1:
    <<: *gpu-common
    command: >
      python train_replica.py --config experiments/exp20_replica_resenc_m_11g_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional --fold 1

  replica-exp20-fold2:
    <<: *gpu-common
    command: >
      python train_replica.py --config experiments/exp20_replica_resenc_m_11g_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional --fold 2

  replica-exp20-fold3:
    <<: *gpu-common
    command: >
      python train_replica.py --config experiments/exp20_replica_resenc_m_11g_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional --fold 3

  replica-exp20-fold4:
    <<: *gpu-common
    command: >
      python train_replica.py --config experiments/exp20_replica_resenc_m_11g_5fold.yaml
        --data_dir /data/Brats2024/training_data1_v2
        --extra_data_dir /data/Brats2024/training_data_additional --fold 4

  # Out-of-fold CV metric: pass every completed fold run dir at once.
  #   RUN_DIRS="runs/replica_a_fold0 runs/replica_b_fold1" docker-compose run --rm replica-eval-val
  replica-eval-val:
    <<: *gpu-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        DIRS="$${RUN_DIRS:-$$(ls -d runs/replica_*_fold* 2>/dev/null)}"
        if [ -z "$$DIRS" ]; then echo "No replica run dirs found; set RUN_DIRS"; exit 1; fi
        python evaluate_replica.py \
          --config experiments/$${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml} \
          --data_dir /data/Brats2024/training_data1_v2 \
          --extra_data_dir /data/Brats2024/training_data_additional \
          --run_dirs $$DIRS --split val

  # Leak-free held-out test, all folds ensembled.
  replica-eval-test:
    <<: *gpu-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        DIRS="$${RUN_DIRS:-$$(ls -d runs/replica_*_fold* 2>/dev/null)}"
        if [ -z "$$DIRS" ]; then echo "No replica run dirs found; set RUN_DIRS"; exit 1; fi
        python evaluate_replica.py \
          --config experiments/$${REPLICA_CONFIG:-exp20_replica_resenc_m_11g_5fold.yaml} \
          --data_dir /data/Brats2024/training_data1_v2 \
          --extra_data_dir /data/Brats2024/training_data_additional \
          --run_dirs $$DIRS --split test
