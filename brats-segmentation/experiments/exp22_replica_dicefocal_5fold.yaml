# =============================================================================
# Exp 22 — Replica + Dice-Focal loss (4-channel), 5-fold CV
# =============================================================================
#
# exp22 is exp20 with ONE change: the cross-entropy term becomes focal (gamma 2).
#
#     exp20:  loss = softDice(no bg) + CE
#     exp22:  loss = softDice(no bg) + Focal(gamma=2)
#
# WHY: on this dataset the loss is dominated by SNFH and background, while NETC and ET
# are tiny — a 20-case audit found NETC at ~0.004 % of voxels. Focal down-weights easy,
# abundant voxels so more of the gradient lands on the rare classes. Everything else
# (plan, patch, batch, schedule, augmentation, deep supervision, folds) is exp20's, so
# exp22 vs exp20 isolates the loss.
#
# NOTE: this is a deliberate DEVIATION from nnU-Net's recipe, not a replication bug.
# exp20 remains the parity run; exp22 is an ablation on top of a verified baseline.
# It reuses exp20's 4-channel preprocessed cache — preprocessing is unchanged.
#
# RUN (cache already built by exp20)
#   python train_replica.py --config experiments/exp22_replica_dicefocal_5fold.yaml --fold 0
# =============================================================================

data:
  dataset: "brats2024"
  train_dir: "../Brats2024/training_data1_v2"
  extra_train_dirs:
    - "../Brats2024/training_data_additional"   # pooled -> 1621 cases, as in Dataset102
  val_dir: "../Brats2024/validation_data"
  modalities: ["t1c", "t1n", "t2f", "t2w"]
  num_classes: 5
  # BraTS 2024 post-treatment labels are already contiguous 0..4; map kept for parity.
  label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  inverse_label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  class_names: {1: "NETC", 2: "SNFH", 3: "ET", 4: "RC"}
  split_seed: 42
  split_ratios: [0.75, 0.15, 0.10]
  n_folds: 5
  # Reserve the seed-42 10 % test patients out of every fold (matches native exp19).
  kfold_holdout_test: true

replica:
  plans_json: "plans/nnUNetResEncM_11GBPlans.json"
  configuration: "3d_fullres"
  # Preprocessed case cache (crop -> masked z-score -> class locations). ~30 GB at fp16
  # for 1621 cases. Shared by every 4-channel replica experiment — the preprocessing is
  # plan-derived and identical, so exp20/exp22 reuse one cache.
  preprocessed_dir: "/app/.cache/replica/Dataset102_4ch"
  store_dtype: "float16"

  # --- nnU-Net's fixed training budget (all defaults, listed for the record) ---------
  num_epochs: 1000
  num_iterations_per_epoch: 250
  num_val_iterations_per_epoch: 50
  initial_lr: 0.01
  weight_decay: 0.00003
  momentum: 0.99
  nesterov: true
  poly_exponent: 0.9
  oversample_foreground_percent: 0.33
  grad_clip: 12.0
  amp: true
  save_every: 50

  # --- loss: nnU-Net's Dice+CE. batch_dice is left null so it comes from the plan ----
  # ---- THE ONLY CHANGE vs exp20 ----------------------------------------------
  loss: "dice_focal"        # softDice(no bg) + Focal; ce_weight weights the focal term
  focal_gamma: 2.0
  # ------------------------------------------------------------------------------
  dice_weight: 1.0
  ce_weight: 1.0
  deep_supervision: true
  ds_zero_lowest: true
  batch_dice: null

  # --- fitting the 11 GB plan onto an 8 GB card -------------------------------------
  batch_size: null          # null -> the plan's 2
  grad_accum_steps: 1       # 2 x micro-batch 1 is also exact (batch_dice is False)
  grad_checkpointing: true  # set false on >= 11 GB VRAM
  patch_size: null          # null -> the plan's [128, 192, 128]

  # --- plumbing ---------------------------------------------------------------------
  # Augmentation costs ~11 s per batch single-threaded (SpatialTransform on the
  # rotation-inflated [243, 270, 205] patch dominates), so ~11 workers are needed to
  # keep a 1.09 s GPU step fed. 12 is also nnU-Net's own default.
  num_workers: 12
  seed: 42
  validate_with_full_images: true   # final sliding-window + mirroring pass
  tile_step_size: 0.5
  use_mirroring: true

# Consumed by evaluate_replica.py / the shared reporting code.
inference:
  mode: "gaussian"
  tta: true
  overlap: 0.5
  postprocess: false   # nnU-Net's default trainer applies none; exp26 tests it

evaluation:
  metrics: ["dice", "hausdorff95"]
  regions:
    ET: [3]            # Enhancing Tissue
    TC: [1, 3]         # Tumor Core = NETC + ET
    WT: [1, 2, 3]      # Whole Tumor = NETC + SNFH + ET
    RC: [4]            # Resection Cavity
  failure_dice_threshold: 0.5
  small_tumor_volume_threshold: 500
  num_failure_cases: 10

# Kept so ExperimentTracker and the shared reporting tools (which read model.name)
# keep working. The replica builds its network from the plan, not from this block.
model:
  name: "nnunet_replica_resenc_m_11g_dicefocal"
  in_channels: 4
  out_channels: 5

experiment:
  output_dir: "./runs"
  save_best_only: true
  log_interval: 10
