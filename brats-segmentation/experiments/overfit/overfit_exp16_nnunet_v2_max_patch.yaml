# ============================================================
# AUTO-GENERATED OVERFIT CONFIG — do not edit by hand.
# Source: exp16_nnunet_v2_max_patch.yaml
# Regenerate: python experiments/generate_overfit_configs.py
#
# Sanity check: memorize 50 MRIs (train = val = test, augmentation OFF,
# early-stopping OFF). Watch TRAIN LOSS -> ~0.1 (val Dice is capped by the
# train-crop vs sliding-window-val mismatch).
# Overrides vs source: optimizer=AdamW, lr=0.001, warmup=0, cases=50, TTA=off, postprocess=off.
# ============================================================
# Exp 8.3 — nnU-Net v2 with max patch (160x192x128)
# Question: Push nnU-Net v2 to the largest patch that fits 8 GB.
# Matches original SegResNet paper size. ~7.5 GB estimated.

data:
  dataset: "brats2024"
  train_dir: "../Brats2024/training_data1_v2"
  val_dir: "../Brats2024/validation_data"
  modalities: ["t1c", "t1n", "t2f", "t2w"]
  num_classes: 5
  label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  inverse_label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  class_names: {1: "NETC", 2: "SNFH", 3: "ET", 4: "RC"}
  overfit: {enabled: true, num_cases: 50}
  split_ratios: [0.75, 0.15, 0.10]
  split_seed: 42

preprocessing:
  spatial_size: [160, 192, 128]
  norm_method: "zscore_nonzero"
  augmentation:
    random_flip_prob: 0.5
    random_rotate_prob: 0.3
    random_rotate_range: 0.5236
    random_intensity_shift: 0.1
    random_intensity_scale: 0.1

model:
  name: "nnunet_v2"
  in_channels: 4
  out_channels: 5
  nnunet_v2:
    variant: "plain"
    kernel_sizes: [[3,3,3], [3,3,3], [3,3,3], [3,3,3], [3,3,3], [3,3,3]]
    strides: [[1,1,1], [2,2,2], [2,2,2], [2,2,2], [2,2,2], [2,2,2]]
    features_per_stage: [32, 64, 128, 256, 320, 320]
    n_blocks_encoder: 2
    n_blocks_decoder: 2
    deep_supervision: true
    grad_checkpointing: true   # overfit: fit AdamW + big patch on 8 GB

training:
  epochs: 150
  batch_size: 1
  num_workers: 2
  learning_rate: 0.001
  weight_decay: 0.00001
  optimizer: "adamw"
  scheduler: "cosine_warm_restarts"
  scheduler_params: {T_0: 50, T_mult: 2, eta_min: 0.000001}
  amp: true
  grad_accum_steps: 2
  val_interval: 10
  early_stopping_patience: 30
  loss: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  sw_batch_size: 1
  sw_overlap: 0.5

evaluation:
  metrics: ["dice", "hausdorff95"]
  regions:
    ET: [3]
    TC: [1, 3]
    WT: [1, 2, 3]
    RC: [4]            # Resection Cavity
  failure_dice_threshold: 0.5
  small_tumor_volume_threshold: 500
  num_failure_cases: 10

experiment:
  output_dir: "./runs/overfit"
  save_best_only: true
  log_interval: 10
