# =============================================================================
# Exp 20 — nnU-Net REPLICA baseline: nnUNetResEncM_11GBPlans / 3d_fullres, 5-fold CV
# =============================================================================
#
# THE QUESTION exp20 answers: can OUR OWN training loop reproduce the numbers the
# native `nnUNetv2_train` produces from the very same plan?
#
# This supersedes the old exp20 (`exp20_nnunet_v2_resenc_m_5fold.yaml`), which ran the
# ResEnc-M *architecture* through `train_kfold.py` but with a MONAI preprocessing /
# augmentation stack, a hand-written epoch definition, and an AdamW-or-SGD choice — a
# combination that never matched nnU-Net and collapsed to all-background under SGD.
# exp20 is now a REPLICA, not an approximation: `src/nnunet_replica/` reimplements
# nnU-Net v2's preprocessing, patch sampling, augmentation, loss, schedule, loop and
# inference, and reads every architectural decision out of the plan below.
#
# WHAT IS BEING REPLICATED
#   plans/nnUNetResEncM_11GBPlans.json, produced by nnUNetPlannerResEncM at an 11 GB
#   VRAM target on Dataset102_BraTS2024ResEnc (the pooled 1621-case BraTS 2024 set):
#     patch [128, 192, 128]   batch 2   spacing 1 mm   batch_dice False
#     ResidualEncoderUNet, 6 stages, features [32, 64, 128, 256, 320, 320],
#     encoder blocks [1, 3, 4, 6, 6, 6], decoder convs [1, 1, 1, 1, 1]  -> 102,354,777 params
#   None of those numbers are repeated in this file on purpose — the loop reads them
#   from the plan, so this config cannot drift from the run it is reproducing.
#
# HELD IDENTICAL TO THE NATIVE RUN
#   - 1000 epochs x 250 iterations (an epoch is 250 optimiser steps, NOT a data pass)
#   - SGD lr 1e-2, momentum 0.99, Nesterov, weight decay 3e-5; poly LR ^0.9, no warmup
#   - Dice (no background, smooth 1e-5) + CE, deep supervision 1/2**i with the deepest
#     head zeroed
#   - 33 % forced-foreground patches, nnU-Net's full batchgenerators augmentation
#   - AMP, gradient-norm clipping at 12
#   - checkpoint selection on the EMA of the 50-patch pseudo-Dice (nnU-Net's own rule)
#   - patient-level 5-fold, split_seed 42, seed-42 10 % test patients held out of every
#     fold — the same partition the native exp19 run used, so numbers are comparable
#
# THE ONLY DEVIATION (hardware, not recipe)
#   `grad_checkpointing: true`. The plan targets 11 GB; this box is an 8 GB RTX 3070
#   Laptop. Recomputing encoder activations in the backward pass brings the planned
#   batch 2 from OOM down to 7.07 GB at 1.09 s/step. It changes memory and speed, not
#   the gradient — so the trained model is unaffected.
#   On a >= 11 GB GPU set `grad_checkpointing: false` for ~2x faster steps.
#
# EXPECTED COST: ~5 min/epoch on the 3070 => ~3.5 days per fold, ~17 days for 5 folds.
# That is the genuine nnU-Net budget; `num_epochs` is the knob if you need it shorter
# (and a shortened run is no longer a replica — say so when reporting it).
#
# RUN
#   python preprocess_replica.py --config experiments/exp20_replica_resenc_m_11g_5fold.yaml
#   python train_replica.py      --config experiments/exp20_replica_resenc_m_11g_5fold.yaml --fold 0
#   python evaluate_replica.py   --config experiments/exp20_replica_resenc_m_11g_5fold.yaml \
#       --run_dirs runs/replica_*_fold0 --split val
# =============================================================================

data:
  dataset: "brats2024"
  train_dir: "../Brats2024/training_data1_v2"
  extra_train_dirs:
    - "../Brats2024/training_data_additional"   # pooled -> 1621 cases, as in Dataset102
  val_dir: "../Brats2024/validation_data"
  modalities: ["t1c", "t1n", "t2f", "t2w"]
  num_classes: 5
  # BraTS 2024 post-treatment labels are already contiguous 0..4; map kept for parity.
  label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  inverse_label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  class_names: {1: "NETC", 2: "SNFH", 3: "ET", 4: "RC"}
  split_seed: 42
  split_ratios: [0.75, 0.15, 0.10]
  n_folds: 5
  # Reserve the seed-42 10 % test patients out of every fold (matches native exp19).
  kfold_holdout_test: true

replica:
  plans_json: "plans/nnUNetResEncM_11GBPlans.json"
  configuration: "3d_fullres"
  # Preprocessed case cache (crop -> masked z-score -> class locations). ~30 GB at fp16
  # for 1621 cases. Shared by every 4-channel replica experiment — the preprocessing is
  # plan-derived and identical, so exp20/exp22 reuse one cache.
  preprocessed_dir: "/app/.cache/replica/Dataset102_4ch"
  store_dtype: "float16"

  # --- nnU-Net's fixed training budget (all defaults, listed for the record) ---------
  num_epochs: 1000
  num_iterations_per_epoch: 250
  num_val_iterations_per_epoch: 50
  initial_lr: 0.01
  weight_decay: 0.00003
  momentum: 0.99
  nesterov: true
  poly_exponent: 0.9
  oversample_foreground_percent: 0.33
  grad_clip: 12.0
  amp: true
  save_every: 50

  # --- loss: nnU-Net's Dice+CE. batch_dice is left null so it comes from the plan ----
  loss: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  deep_supervision: true
  ds_zero_lowest: true
  batch_dice: null

  # --- fitting the 11 GB plan onto an 8 GB card -------------------------------------
  batch_size: null          # null -> the plan's 2
  grad_accum_steps: 1       # 2 x micro-batch 1 is also exact (batch_dice is False)
  grad_checkpointing: true  # set false on >= 11 GB VRAM
  patch_size: null          # null -> the plan's [128, 192, 128]

  # --- plumbing ---------------------------------------------------------------------
  # Augmentation costs ~11 s per batch single-threaded (SpatialTransform on the
  # rotation-inflated [243, 270, 205] patch dominates), so ~11 workers are needed to
  # keep a 1.09 s GPU step fed. 12 is also nnU-Net's own default.
  num_workers: 12
  seed: 42
  validate_with_full_images: true   # final sliding-window + mirroring pass
  tile_step_size: 0.5
  use_mirroring: true

# Consumed by evaluate_replica.py / the shared reporting code.
inference:
  mode: "gaussian"
  tta: true
  overlap: 0.5
  postprocess: false   # nnU-Net's default trainer applies none; exp26 tests it

evaluation:
  metrics: ["dice", "hausdorff95"]
  regions:
    ET: [3]            # Enhancing Tissue
    TC: [1, 3]         # Tumor Core = NETC + ET
    WT: [1, 2, 3]      # Whole Tumor = NETC + SNFH + ET
    RC: [4]            # Resection Cavity
  failure_dice_threshold: 0.5
  small_tumor_volume_threshold: 500
  num_failure_cases: 10

# Kept so ExperimentTracker and the shared reporting tools (which read model.name)
# keep working. The replica builds its network from the plan, not from this block.
model:
  name: "nnunet_replica_resenc_m_11g"
  in_channels: 4
  out_channels: 5

experiment:
  output_dir: "./runs"
  save_best_only: true
  log_interval: 10
