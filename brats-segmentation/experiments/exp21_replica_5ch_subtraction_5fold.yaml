# =============================================================================
# Exp 21 — Replica + T1Gd−T1 subtraction channel (5-channel input), 5-fold CV
# =============================================================================
#
# exp21 is exp20 with ONE change: a fifth input channel,
#
#     T1Gd − T1  =  t1c − t1n     (contrast-enhancement subtraction map)
#
# so the network sees [t1c, t1n, t2f, t2w, (t1c−t1n)] and in_channels goes 4 -> 5.
# Every other element — the plan, patch [128, 192, 128], batch 2, ResEnc-M topology,
# 1000x250 SGD/poly schedule, augmentation, loss, checkpoint rule, folds — is exp20's.
# exp21 vs exp20 therefore isolates the value of handing the model the enhancement
# subtraction explicitly instead of making it learn the difference.
#
# WHY IT IS STILL A CLEAN COMPARISON
#   The plan's `use_mask_for_norm` has one flag per planned channel (4). The replica
#   extends the last flag to any extra channel, so the subtraction map is z-scored
#   inside the brain mask exactly like the four planned modalities. The architecture is
#   unchanged apart from the first conv's input width.
#
# DATA REQUIREMENT
#   Each case directory needs a "*-sub.nii.gz" co-registered with the other modalities:
#       python precompute_subtraction.py --data_dir ../Brats2024/training_data1_v2
#       python precompute_subtraction.py --data_dir ../Brats2024/training_data_additional
#   The 5-channel preprocessed cache is SEPARATE from exp20's — it must never share one.
#
# RUN
#   python preprocess_replica.py --config experiments/exp21_replica_5ch_subtraction_5fold.yaml
#   python train_replica.py      --config experiments/exp21_replica_5ch_subtraction_5fold.yaml --fold 0
# =============================================================================

data:
  dataset: "brats2024"
  train_dir: "../Brats2024/training_data1_v2"
  extra_train_dirs:
    - "../Brats2024/training_data_additional"
  val_dir: "../Brats2024/validation_data"
  # ---- THE ONLY CHANGE vs exp20 ------------------------------------------------
  modalities: ["t1c", "t1n", "t2f", "t2w", "sub"]
  # ------------------------------------------------------------------------------
  num_classes: 5
  label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  inverse_label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  class_names: {1: "NETC", 2: "SNFH", 3: "ET", 4: "RC"}
  split_seed: 42
  split_ratios: [0.75, 0.15, 0.10]
  n_folds: 5
  kfold_holdout_test: true

replica:
  plans_json: "plans/nnUNetResEncM_11GBPlans.json"
  configuration: "3d_fullres"
  preprocessed_dir: "/app/.cache/replica/Dataset102_5ch"   # distinct: 5-channel arrays
  store_dtype: "float16"

  num_epochs: 1000
  num_iterations_per_epoch: 250
  num_val_iterations_per_epoch: 50
  initial_lr: 0.01
  weight_decay: 0.00003
  momentum: 0.99
  nesterov: true
  poly_exponent: 0.9
  oversample_foreground_percent: 0.33
  grad_clip: 12.0
  amp: true
  save_every: 50

  loss: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  deep_supervision: true
  ds_zero_lowest: true
  batch_dice: null

  batch_size: null
  grad_accum_steps: 1
  grad_checkpointing: true   # the extra channel adds ~0.2 GB; still fits 8 GB
  patch_size: null

  num_workers: 12
  seed: 42
  validate_with_full_images: true
  tile_step_size: 0.5
  use_mirroring: true

inference:
  mode: "gaussian"
  tta: true
  overlap: 0.5
  postprocess: false

evaluation:
  metrics: ["dice", "hausdorff95"]
  regions:
    ET: [3]
    TC: [1, 3]
    WT: [1, 2, 3]
    RC: [4]
  failure_dice_threshold: 0.5
  small_tumor_volume_threshold: 500
  num_failure_cases: 10

model:
  name: "nnunet_replica_resenc_m_11g_5ch"
  in_channels: 5
  out_channels: 5

experiment:
  output_dir: "./runs"
  save_best_only: true
  log_interval: 10
