# =============================================================================
# Exp 24 — Replica with the PLAIN U-Net plan (no residual encoder), 5-fold CV
# =============================================================================
#
# exp24 is exp20 with ONE change: the plan. Instead of the ResEnc-M plan it uses the
# plan nnU-Net's *default* (non-ResEnc) planner produced for the same dataset at the
# same 11 GB budget:
#
#     plans/nnUNetPlainUNet_11GBPlans.json   <- generated by ExperimentPlanner(102, 11 GB)
#
# The two planners happened to land on the SAME patch [128, 192, 128] and the SAME
# batch 2 for this dataset, so this is an unusually clean architecture comparison —
# only the network body differs:
#
#     exp20  ResidualEncoderUNet  enc blocks [1,3,4,6,6,6], dec [1,1,1,1,1]  102,354,777 params
#     exp24  PlainConvUNet        enc convs  [2,2,2,2,2,2], dec [2,2,2,2,2]   31,200,601 params
#
# Same features per stage, same strides, same deep-supervision scales, same recipe.
# exp24 vs exp20 therefore answers "is the residual encoder worth 3.3x the parameters
# on BraTS 2024 post-treatment?" — the question exp18-vs-exp20 tried to ask before, but
# could not, because those two also differed in training engine and recipe.
#
# Reuses exp20's 4-channel preprocessed cache (preprocessing is plan-derived and the
# two plans agree on spacing, normalization and target spacing).
#
# TO REGENERATE THE PLAN (needs nnUNet_preprocessed/Dataset102.../dataset_fingerprint.json):
#   nnUNet_preprocessed=$PWD/nnunet_data/nnUNet_preprocessed python3 -c \
#     "from nnunetv2.experiment_planning.experiment_planners.default_experiment_planner \
#      import ExperimentPlanner; \
#      ExperimentPlanner(102, gpu_memory_target_in_gb=11, \
#                        plans_name='nnUNetPlainUNet_11GBPlans').plan_experiment()"
#
# RUN (cache already built by exp20)
#   python train_replica.py --config experiments/exp24_replica_plain_unet_11g_5fold.yaml --fold 0
# =============================================================================

data:
  dataset: "brats2024"
  train_dir: "../Brats2024/training_data1_v2"
  extra_train_dirs:
    - "../Brats2024/training_data_additional"
  val_dir: "../Brats2024/validation_data"
  modalities: ["t1c", "t1n", "t2f", "t2w"]
  num_classes: 5
  label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  inverse_label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  class_names: {1: "NETC", 2: "SNFH", 3: "ET", 4: "RC"}
  split_seed: 42
  split_ratios: [0.75, 0.15, 0.10]
  n_folds: 5
  kfold_holdout_test: true

replica:
  # ---- THE ONLY CHANGE vs exp20 --------------------------------------------------
  plans_json: "plans/nnUNetPlainUNet_11GBPlans.json"
  # --------------------------------------------------------------------------------
  configuration: "3d_fullres"
  preprocessed_dir: "/app/.cache/replica/Dataset102_4ch"   # shared with exp20/exp22
  store_dtype: "float16"

  num_epochs: 1000
  num_iterations_per_epoch: 250
  num_val_iterations_per_epoch: 50
  initial_lr: 0.01
  weight_decay: 0.00003
  momentum: 0.99
  nesterov: true
  poly_exponent: 0.9
  oversample_foreground_percent: 0.33
  grad_clip: 12.0
  amp: true
  save_every: 50

  loss: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  deep_supervision: true
  ds_zero_lowest: true
  batch_dice: null

  batch_size: null
  grad_accum_steps: 1
  # 31 M params instead of 102 M, but activations — not weights — are what fills an
  # 8 GB card, and PlainConvUNet runs 2 convs per stage at full resolution. Measured:
  # batch 2 OOMs without recomputation, fits with it. On >= 11 GB VRAM set this false.
  grad_checkpointing: true
  patch_size: null

  num_workers: 12
  seed: 42
  validate_with_full_images: true
  tile_step_size: 0.5
  use_mirroring: true

inference:
  mode: "gaussian"
  tta: true
  overlap: 0.5
  postprocess: false

evaluation:
  metrics: ["dice", "hausdorff95"]
  regions:
    ET: [3]
    TC: [1, 3]
    WT: [1, 2, 3]
    RC: [4]
  failure_dice_threshold: 0.5
  small_tumor_volume_threshold: 500
  num_failure_cases: 10

model:
  name: "nnunet_replica_plain_unet_11g"
  in_channels: 4
  out_channels: 5

experiment:
  output_dir: "./runs"
  save_best_only: true
  log_interval: 10
