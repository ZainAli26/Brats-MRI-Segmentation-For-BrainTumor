# =============================================================================
# Exp 25 — Replica recipe, SegResNet architecture, 5-fold CV
# =============================================================================
#
# exp25 keeps the entire nnU-Net recipe and swaps only the network: MONAI's
# SegResNetDS (SegResNet with deep-supervision heads) instead of the planned
# ResidualEncoderUNet.
#
#     patch, batch, spacing, normalization    <- still the ResEnc-M plan
#     sampling, augmentation, loss, schedule  <- still nnU-Net's
#     network                                 <- SegResNetDS
#
# This is the successor to the old exp21/exp23/exp25 SegResNet arm, and it is a much
# fairer comparison than those were: previously "SegResNet vs nnU-Net" also meant a
# different preprocessing stack, a different epoch definition and a different optimiser.
# Here the ONLY difference is the architecture, so exp25 vs exp20 measures exactly that.
#
# DEEP SUPERVISION LINES UP EXACTLY (verified, not assumed). SegResNetDS emits heads only
# from its upsampling stages, so blocks_down of length 5 gives 4 heads at 1, 1/2, 1/4, 1/8
# — one fewer than the plan's 5. But the plan's 5th head is the one nnU-Net *zeroes*, so
# the trainer drops the zeroing here and the supervised weights come out identical:
#
#     exp20  heads 1, 1/2, 1/4, 1/8, 1/16   weights [0.5333, 0.2667, 0.1333, 0.0667, 0.0]
#     exp25  heads 1, 1/2, 1/4, 1/8         weights [0.5333, 0.2667, 0.1333, 0.0667]
#
# Both train the same four resolutions with the same weights. The trainer logs the head
# count, scales and weights at startup so this is checkable in every run log.
#
# THE REAL REMAINING ASYMMETRY: weight initialisation. The planned nets get nnU-Net's
# InitWeights_He(1e-2) plus zeroed residual norms; SegResNetDS keeps MONAI's own default
# init, because He-initialising someone else's residual design is a change in its own
# right. So exp25 vs exp20 is "architecture + its native initialisation", not
# "architecture alone".
#
# READING THE CURVES: SegResNetDS returns all heads in train mode but only the
# full-resolution head in eval mode, so exp25's `val_loss` is the top head alone while
# `train_loss` is the deep-supervised sum. The two curves in progress.png are therefore
# NOT on the same scale for this experiment, and exp25's val_loss is not comparable to
# exp20's. Compare pseudo-Dice and the full-image validation Dice instead — both are
# computed from the full-resolution head in every experiment.
#
# Reuses exp20's 4-channel preprocessed cache.
#
# RUN (cache already built by exp20)
#   python train_replica.py --config experiments/exp25_replica_segresnet_ds_5fold.yaml --fold 0
# =============================================================================

data:
  dataset: "brats2024"
  train_dir: "../Brats2024/training_data1_v2"
  extra_train_dirs:
    - "../Brats2024/training_data_additional"
  val_dir: "../Brats2024/validation_data"
  modalities: ["t1c", "t1n", "t2f", "t2w"]
  num_classes: 5
  label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  inverse_label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  class_names: {1: "NETC", 2: "SNFH", 3: "ET", 4: "RC"}
  split_seed: 42
  split_ratios: [0.75, 0.15, 0.10]
  n_folds: 5
  kfold_holdout_test: true

replica:
  # The plan still supplies patch/batch/spacing/normalization — only the network changes.
  plans_json: "plans/nnUNetResEncM_11GBPlans.json"
  configuration: "3d_fullres"
  preprocessed_dir: "/app/.cache/replica/Dataset102_4ch"   # shared with exp20/exp22/exp24
  store_dtype: "float16"

  # ---- THE ONLY CHANGE vs exp20 --------------------------------------------------
  architecture_override: "segresnet_ds"
  segresnet:
    init_filters: 32
    blocks_down: [1, 2, 2, 4, 4]   # 5 stages -> 5 deep-supervision heads, as the plan has
    dsdepth: 5
  # --------------------------------------------------------------------------------

  num_epochs: 1000
  num_iterations_per_epoch: 250
  num_val_iterations_per_epoch: 50
  initial_lr: 0.01
  weight_decay: 0.00003
  momentum: 0.99
  nesterov: true
  poly_exponent: 0.9
  oversample_foreground_percent: 0.33
  grad_clip: 12.0
  amp: true
  save_every: 50

  loss: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  deep_supervision: true
  ds_zero_lowest: true
  batch_dice: null

  batch_size: null
  # SegResNetDS exposes no encoder.stages hook, so the replica's checkpointing helper
  # does not apply and batch 2 OOMs on 8 GB (measured). Accumulating two micro-batches
  # of 1 is the substitute — and with batch_dice False it is EXACT, not an
  # approximation: Dice is a per-sample mean, CE a per-voxel mean, and InstanceNorm
  # never mixes samples, so the gradient equals a single batch-2 step's.
  grad_accum_steps: 2
  grad_checkpointing: false
  patch_size: null

  num_workers: 12
  seed: 42
  validate_with_full_images: true
  tile_step_size: 0.5
  use_mirroring: true

inference:
  mode: "gaussian"
  tta: true
  overlap: 0.5
  postprocess: false

evaluation:
  metrics: ["dice", "hausdorff95"]
  regions:
    ET: [3]
    TC: [1, 3]
    WT: [1, 2, 3]
    RC: [4]
  failure_dice_threshold: 0.5
  small_tumor_volume_threshold: 500
  num_failure_cases: 10

model:
  name: "nnunet_replica_segresnet_ds"
  in_channels: 4
  out_channels: 5

experiment:
  output_dir: "./runs"
  save_best_only: true
  log_interval: 10
