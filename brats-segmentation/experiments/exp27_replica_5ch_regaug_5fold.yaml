# =============================================================================
# Exp 27 — exp21 + cross-patient registration augmentation, 5-fold CV
# =============================================================================
#
# exp27 is exp21 with ONE change: the training set is expanded with synthetic
# cases built by warping one patient's whole brain into another patient's
# anatomical space (Ferreira et al., "How we won BraTS 2023"), carrying the
# labels through the same transform:
#
#     moving patient M --SyN on t1n--> fixed patient F's space
#         -> BraTS-GLI-<M>-reg-<F>/  (all modalities + seg, one shared transform)
#
# Everything else — the 5-channel input [t1c, t1n, t2f, t2w, t1c−t1n], the
# ResEnc-M 11 GB plan, patch [128, 192, 128], batch 2, the 1000x250 SGD/poly
# schedule, loss, checkpoint rule, folds and held-out test patients — is exp21's.
# exp27 vs exp21 therefore isolates the value of the registration augmentation,
# and exp27 vs exp20 gives augmentation + subtraction channel together.
#
# COMPUTE IS UNCHANGED
#   nnU-Net's "epoch" is a fixed 250 iterations, not a pass over the data, so
#   tripling the training pool costs no extra GPU time — the same number of
#   gradient steps now draw patches from a more diverse pool. exp27 vs exp21 is
#   an equal-compute comparison.
#
# SYNTHETIC:REAL RATIO — the one thing to watch
#   At k=2 roughly 60 % of each fold's training cases are synthetic, and cases
#   are sampled uniformly, so the model sees real data ~40 % of the time. That
#   is the intended dose of this experiment. If it under-performs exp21,
#   regenerate with `-k 1` (or cap with --max-pairs) before concluding that
#   registration augmentation does not help — the ratio and the method are two
#   different questions.
#
# NO LEAKAGE — HOW IT IS ENFORCED
#   A synthetic case carries the moving patient's tumour and the fixed patient's
#   geometry, so it is only usable where BOTH patients are training patients.
#   Two independent guards:
#     1. generation: --config excludes the seed-42 held-out test patients from
#        pairing entirely, in both the moving and the fixed role;
#     2. splitting: src/nnunet_replica/splits.py adds a synthetic case to fold
#        k's TRAIN list only when both its patients are in fold k's train set,
#        and never puts synthetic data in a val or test list.
#   Validation and test sets are therefore byte-identical to exp21's, which is
#   what makes the two runs comparable. `synthetic_train_dirs` is deliberately a
#   separate key from `extra_train_dirs`: the latter is patient-split like real
#   data and would drop synthetic cases into validation (the splitter raises if
#   it ever sees that).
#
# DATA REQUIREMENT
#   Real cases need "*-sub.nii.gz" exactly as in exp21:
#       python precompute_subtraction.py --data_dir ../Brats2024/training_data1_v2
#       python precompute_subtraction.py --data_dir ../Brats2024/training_data_additional
#   Synthetic cases get theirs from --with-subtraction (computed from the warped
#   t1c/t1n, so it matches what precompute_subtraction.py would produce):
#       python augment_registration.py \
#           --data-dir ../Brats2024/training_data1_v2 \
#           --data-dir ../Brats2024/training_data_additional \
#           --output-dir ../Brats2024/synthetic_regaug \
#           --config experiments/exp27_replica_5ch_regaug_5fold.yaml \
#           -k 2 --seed 42 --transform SyN --with-subtraction --num-workers 4
#   Measured cost of that pass: ~11 h wall on a 16-core box and ~79 GB of NIfTI
#   for the 2936 pairs, plus ~67 GB of preprocessed cache for them. It resumes if
#   interrupted. At `-k 1` both halve and the synthetic share drops to ~44 %.
#
# CACHE
#   Shares exp21's 5-channel preprocessed cache ON PURPOSE. The cache is keyed by
#   case id and a real case preprocesses identically for both experiments, so
#   pointing exp27 here means the preprocessor only has to add the synthetic
#   cases (~30 GB and several hours saved). exp21 never references those ids, so
#   it is unaffected. It must still never share the 4-channel exp20 cache.
#
# RUN
#   python preprocess_replica.py --config experiments/exp27_replica_5ch_regaug_5fold.yaml
#   python train_replica.py      --config experiments/exp27_replica_5ch_regaug_5fold.yaml --fold 0
# =============================================================================

data:
  dataset: "brats2024"
  train_dir: "../Brats2024/training_data1_v2"
  extra_train_dirs:
    - "../Brats2024/training_data_additional"
  # ---- THE ONLY CHANGE vs exp21 ------------------------------------------------
  # Train-side only. Never pooled with the real dirs, never patient-split.
  synthetic_train_dirs:
    - "../Brats2024/synthetic_regaug"
  # ------------------------------------------------------------------------------
  val_dir: "../Brats2024/validation_data"
  modalities: ["t1c", "t1n", "t2f", "t2w", "sub"]
  num_classes: 5
  label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  inverse_label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  class_names: {1: "NETC", 2: "SNFH", 3: "ET", 4: "RC"}
  split_seed: 42
  split_ratios: [0.75, 0.15, 0.10]
  n_folds: 5
  kfold_holdout_test: true

replica:
  plans_json: "plans/nnUNetResEncM_11GBPlans.json"
  configuration: "3d_fullres"
  preprocessed_dir: "/app/.cache/replica/Dataset102_5ch"   # shared with exp21, see above
  store_dtype: "float16"

  num_epochs: 1000
  num_iterations_per_epoch: 250
  num_val_iterations_per_epoch: 50
  initial_lr: 0.01
  weight_decay: 0.00003
  momentum: 0.99
  nesterov: true
  poly_exponent: 0.9
  oversample_foreground_percent: 0.33
  grad_clip: 12.0
  amp: true
  # 10, not nnU-Net's 50: `--c` resumes from checkpoint_latest.pth ONLY, and that file is
  # written every save_every epochs. At the measured 482 s/epoch for this 5-channel config,
  # 50 epochs means a 6.7 h window in which a crash loses everything since the last save —
  # and if the crash lands before epoch 50 there is no latest at all, so `--c` silently
  # starts a fresh 4-day run. 10 epochs = ~80 min exposure for an 819 MB write.
  # Affects crash resilience only, never the result.
  save_every: 10

  loss: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  deep_supervision: true
  ds_zero_lowest: true
  batch_dice: null

  batch_size: null
  grad_accum_steps: 1
  grad_checkpointing: true
  patch_size: null

  num_workers: 12
  seed: 42
  validate_with_full_images: true
  tile_step_size: 0.5
  use_mirroring: true

inference:
  mode: "gaussian"
  tta: true
  overlap: 0.5
  postprocess: false

evaluation:
  metrics: ["dice", "hausdorff95"]
  regions:
    ET: [3]
    TC: [1, 3]
    WT: [1, 2, 3]
    RC: [4]
  failure_dice_threshold: 0.5
  small_tumor_volume_threshold: 500
  num_failure_cases: 10

model:
  name: "nnunet_replica_resenc_m_11g_5ch_regaug"
  in_channels: 5
  out_channels: 5

experiment:
  output_dir: "./runs"
  save_best_only: true
  log_interval: 10
